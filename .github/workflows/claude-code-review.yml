name: Claude Code Review

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Full Claude review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.sha }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            Perform a full code review of every change in this pull request.
            Focus on correctness, Swift 6 concurrency, AppKit lifecycle behavior,
            Keychain and token security, test coverage, and maintainability.
            Do not modify files.

            Post actionable findings as inline comments. Post one final top-level
            comment headed "Full Claude Code Review" that includes the exact line
            "Reviewed commit: ${{ github.event.pull_request.head.sha }}".
            If there are no actionable findings, include the exact line
            "No actionable findings."
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
