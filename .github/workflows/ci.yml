name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Swift validation
    # macOS 26 floor (decision 0004): macos-15 ships Xcode 16 and cannot build
    # for macOS 26, which NexusKit requires.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Test Swift package
        run: swift test

      - name: Test Xcode project
        run: |
          xcodebuild test \
            -project LifeOSMenubar.xcodeproj \
            -scheme LifeOSMenubar \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release app
        run: |
          xcodebuild build \
            -project LifeOSMenubar.xcodeproj \
            -scheme LifeOSMenubar \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
