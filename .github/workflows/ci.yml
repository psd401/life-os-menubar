name: CI

# Skipped when every changed file is Markdown, so docs don't
# spend macOS minutes (standards/06, "Runner minutes"). Any other file runs it.
# If "Swift validation" ever becomes a required check, replace paths-ignore with
# a skip inside the job: a workflow skipped this way reports no status, so a
# required check would wait forever.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Swift validation
    # macOS 26 floor (decision 0004). `macos-15` ships Xcode 16 and cannot build
    # for macOS 26 at all. `xcode-27` is macOS 27 with Xcode 27, the toolchain the
    # app is developed against. `macos-26` (Xcode 26.6) failed on vendored
    # NexusKit until psd-dev-standards#194 fixed it upstream; CodeQL's autobuild
    # now builds the app with Xcode 26.6 on every PR. `xcode-27` is a preview
    # label: move to the stable macOS 27 label once one exists.
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Test Swift package
        run: swift test

      - name: Test Xcode project
        run: |
          xcodebuild test \
            -project LifeOSMenubar.xcodeproj \
            -scheme LifeOSMenubar \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release app
        run: |
          xcodebuild build \
            -project LifeOSMenubar.xcodeproj \
            -scheme LifeOSMenubar \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
