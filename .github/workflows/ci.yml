name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Swift validation
    # macOS 26 floor (decision 0004). `macos-15` ships Xcode 16 and cannot build
    # for macOS 26 at all. `macos-26` can, but its Xcode 26 type checker gives up
    # on NexusKit's `NexusGallery2.swift` ("unable to type-check this expression
    # in reasonable time") — and that file is vendored, so it cannot be fixed or
    # excluded here. `xcode-27` is macOS 27 with Xcode 27, the toolchain the app is
    # actually developed against, and it compiles the package. It is a preview
    # label: move to the stable macOS 27 label once one exists.
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Test Swift package
        run: swift test

      - name: Test Xcode project
        run: |
          xcodebuild test \
            -project LifeOSMenubar.xcodeproj \
            -scheme LifeOSMenubar \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release app
        run: |
          xcodebuild build \
            -project LifeOSMenubar.xcodeproj \
            -scheme LifeOSMenubar \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
